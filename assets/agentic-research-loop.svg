<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Research Workflow</title>
  <desc id="desc">A visual workflow from research question through planning, sources, analysis, critique, synthesis and human review.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#18201d" flood-opacity=".16"/>
    </filter>
    <linearGradient id="rail" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0e7c66"/>
      <stop offset=".58" stop-color="#3f6ea8"/>
      <stop offset="1" stop-color="#a44923"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#f5f7fb"/>
  <rect x="72" y="78" width="1056" height="604" rx="36" fill="#ffffff" filter="url(#shadow)"/>
  <path d="M245 382 C245 205 402 134 598 134 C808 134 956 220 956 382 C956 544 807 628 598 628 C402 628 245 556 245 382Z" fill="none" stroke="url(#rail)" stroke-width="22" stroke-linecap="round"/>
  <path d="M924 305 L980 383 L887 398" fill="none" stroke="#a44923" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="600" y="360" text-anchor="middle" font-size="42" font-weight="750" fill="#111418">Agentic Research</text>
    <text x="600" y="404" text-anchor="middle" font-size="22" fill="#59615f">planen, prüfen, synthetisieren, fachlich entscheiden</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111418">
    <g>
      <rect x="128" y="328" width="185" height="92" rx="18" fill="#eef8f5" stroke="#b7ddd3"/>
      <text x="220" y="365" text-anchor="middle">Frage</text>
      <text x="220" y="395" text-anchor="middle" font-size="15" font-weight="500" fill="#59615f">Scope klaeren</text>
    </g>
    <g>
      <rect x="268" y="145" width="185" height="92" rx="18" fill="#edf4fb" stroke="#bfd4e8"/>
      <text x="360" y="182" text-anchor="middle">Plan</text>
      <text x="360" y="212" text-anchor="middle" font-size="15" font-weight="500" fill="#59615f">Teilfragen</text>
    </g>
    <g>
      <rect x="508" y="92" width="185" height="92" rx="18" fill="#fff6e8" stroke="#e9c88d"/>
      <text x="600" y="129" text-anchor="middle">Quellen</text>
      <text x="600" y="159" text-anchor="middle" font-size="15" font-weight="500" fill="#59615f">Korpus</text>
    </g>
    <g>
      <rect x="748" y="145" width="185" height="92" rx="18" fill="#f4f1ff" stroke="#cdc4ec"/>
      <text x="840" y="182" text-anchor="middle">Analyse</text>
      <text x="840" y="212" text-anchor="middle" font-size="15" font-weight="500" fill="#59615f">Findings</text>
    </g>
    <g>
      <rect x="887" y="328" width="185" height="92" rx="18" fill="#fff0ec" stroke="#e6b9aa"/>
      <text x="980" y="365" text-anchor="middle">Kritik</text>
      <text x="980" y="395" text-anchor="middle" font-size="15" font-weight="500" fill="#59615f">Widerspruch</text>
    </g>
    <g>
      <rect x="748" y="520" width="185" height="92" rx="18" fill="#eef8f5" stroke="#b7ddd3"/>
      <text x="840" y="557" text-anchor="middle">Synthese</text>
      <text x="840" y="587" text-anchor="middle" font-size="15" font-weight="500" fill="#59615f">Arbeitsstand</text>
    </g>
    <g>
      <rect x="508" y="574" width="185" height="92" rx="18" fill="#111418"/>
      <text x="600" y="611" text-anchor="middle" fill="#ffffff">Human Review</text>
      <text x="600" y="641" text-anchor="middle" font-size="15" font-weight="500" fill="#cfd6d3">Freigabe</text>
    </g>
    <g>
      <rect x="268" y="520" width="185" height="92" rx="18" fill="#edf4fb" stroke="#bfd4e8"/>
      <text x="360" y="557" text-anchor="middle">Nutzung</text>
      <text x="360" y="587" text-anchor="middle" font-size="15" font-weight="500" fill="#59615f">Lehre/Forschung</text>
    </g>
  </g>
</svg>
